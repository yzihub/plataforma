version: "3.9"

services:
  runtime-cognitive:
    image: yzihub/ju-runtime-cognitive:behavioral-qa
    env_file:
      - ../../.env.local
    environment:
      NODE_ENV: production
      JUREMA_RUNTIME_PORT: "3333"
      JU_RUNTIME_MODE: behavioral_qa
      JUREMA_CUTOVER_SHADOW_ONLY: "true"
      JUREMA_CUTOVER_INTERNAL_ONLY: "true"
      JUREMA_CUTOVER_FORCE_N8N: "true"
      JUREMA_CUTOVER_PERCENTAGE: "0"
      JUREMA_PILOT_STAGE: "0"
      JUREMA_CUTOVER_READINESS_LEVEL: "1"
      JU_BEHAVIORAL_QA_PHONE: "5583999990002"
    networks:
      - YziNet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=YziNet
        - traefik.http.routers.runtime.rule=Host(`runtime.yzihub.com`)
        - traefik.http.routers.runtime.entrypoints=websecure
        - traefik.http.routers.runtime.tls=true
        - traefik.http.routers.runtime.service=runtime
        - traefik.http.services.runtime.loadbalancer.server.port=3333
        - traefik.http.services.runtime.loadbalancer.passhostheader=true
        - traefik.http.middlewares.runtime-headers.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.middlewares.runtime-headers.headers.customrequestheaders.X-Forwarded-Port=443
        - traefik.http.middlewares.runtime-headers.headers.customrequestheaders.X-Forwarded-Host=runtime.yzihub.com
        - traefik.http.routers.runtime.middlewares=runtime-headers

networks:
  YziNet:
    external: true

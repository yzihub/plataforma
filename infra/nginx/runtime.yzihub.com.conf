map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name runtime.yzihub.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name runtime.yzihub.com;

  ssl_certificate /etc/letsencrypt/live/runtime.yzihub.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/runtime.yzihub.com/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Cloudflare real IP handling.
  # Keep this include in sync with the current Cloudflare IP list on the origin host.
  include /etc/nginx/conf.d/cloudflare-realip.conf;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  client_max_body_size 2m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 75s;
  keepalive_timeout 65s;
  proxy_connect_timeout 10s;
  proxy_send_timeout 75s;
  proxy_read_timeout 75s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    application/json
    application/javascript
    application/xml
    application/rss+xml
    text/css
    text/plain
    text/javascript
    text/xml
    application/wasm;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  location / {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_redirect off;
  }

  location = /metrics {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
  }
}
